<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google OAuth Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-lg shadow-lg max-w-md w-full">
        <h1 class="text-2xl font-bold text-center mb-6">Test Google OAuth</h1>
        
        <button
            onclick="handleGoogleLogin()"
            class="w-full flex items-center justify-center gap-3 px-6 py-3 bg-white border-2 border-gray-300 rounded-lg font-semibold text-gray-700 hover:bg-gray-50 transition-all"
        >
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
        </button>

        <div id="status" class="mt-4 p-4 rounded hidden"></div>
        
        <div id="userInfo" class="mt-6 hidden">
            <h2 class="text-lg font-semibold mb-2">Logged In!</h2>
            <div class="bg-green-50 border border-green-200 rounded p-4">
                <p><strong>Email:</strong> <span id="userEmail"></span></p>
                <p><strong>Username:</strong> <span id="userName"></span></p>
                <p><strong>Token:</strong> <span id="userToken" class="text-xs break-all"></span></p>
            </div>
            <button onclick="testAuthAPI()" class="mt-4 w-full bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                Test Protected API
            </button>
            <button onclick="logout()" class="mt-2 w-full bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">
                Logout
            </button>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'http://localhost:8080';

        function handleGoogleLogin() {
            console.log("Google login clicked");
            // Redirect to backend OAuth endpoint
            window.location.href = `${BACKEND_URL}/api/auth/google/login`;
        }

        // Check if we're on the callback URL
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const username = urlParams.get('username');
            const email = urlParams.get('email');
            const error = urlParams.get('error');

            if (error) {
                showStatus('Login failed: ' + error, 'error');
                return;
            }

            if (token) {
                // Store credentials
                localStorage.setItem('authToken', token);
                localStorage.setItem('username', username);
                localStorage.setItem('email', email);
                
                // Clean URL
                window.history.replaceState({}, document.title, window.location.pathname);
                
                showUserInfo(token, username, email);
            } else {
                // Check if already logged in
                const storedToken = localStorage.getItem('authToken');
                if (storedToken) {
                    showUserInfo(
                        storedToken,
                        localStorage.getItem('username'),
                        localStorage.getItem('email')
                    );
                }
            }
        });

        function showUserInfo(token, username, email) {
            document.getElementById('userEmail').textContent = email;
            document.getElementById('userName').textContent = username;
            document.getElementById('userToken').textContent = token.substring(0, 50) + '...';
            document.getElementById('userInfo').classList.remove('hidden');
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `mt-4 p-4 rounded ${type === 'error' ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`;
            statusDiv.classList.remove('hidden');
        }

        async function testAuthAPI() {
            const token = localStorage.getItem('authToken');
            if (!token) {
                showStatus('No token found. Please login first.', 'error');
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/api/auth/profile`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                const data = await response.json();
                
                if (response.ok) {
                    showStatus('API call successful! ' + JSON.stringify(data), 'success');
                } else {
                    showStatus('API call failed: ' + data.detail, 'error');
                }
            } catch (error) {
                showStatus('API call error: ' + error.message, 'error');
            }
        }

        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('username');
            localStorage.removeItem('email');
            location.reload();
        }
    </script>
</body>
</html>
